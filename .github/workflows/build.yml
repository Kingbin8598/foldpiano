name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'
      - name: Build
        run: |
          mkdir -p src
          cp MainActivity.java src/
          gradle assembleDebug -Dorg.gradle.jvmargs=-Xmx2g
      - uses: actions/upload-artifact@v4
        with:
          name: foldpiano-apk
          path: build/outputs/apk/debug/app-debug.apk
